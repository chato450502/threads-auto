name: Generate Threads Drafts

on:
  schedule:
    - cron: "0 18 * * *"   # JST 03:00（= 18:00 UTC）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ドライラン（Claudeを呼ばず不足枠のみ表示）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: threads-state   # publish と generate で共有（同時に1つだけ実行）
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main   # 起動時点ではなく「実行開始時点の最新」を読む

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GENERATE_MODEL: "claude-opus-5-5"
          GENERATE_EFFORT: "medium"
          FILTER_MODEL: "claude-sonnet-4-6"
          FALLBACK_MODEL: "claude-sonnet-4-6"
          LENGTH_MODE: "graphemes"
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python src/generate.py

      - name: Commit new drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/queue.json posts/used_videos.json
          if git diff --cached --quiet; then
            echo "変更なし（コミット不要）"
          else
            git commit -m "chore: add generated drafts [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              sleep 5
            done
            echo "::error::記録（queue/state）の保存に失敗しました。二重投稿のおそれがあります"
            exit 1
          fi
