name: Generate Threads Drafts

on:
  schedule:
    - cron: "0 18 * * *"   # JST 03:00（= 18:00 UTC）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ドライラン（Claudeを呼ばず不足枠のみ表示）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: threads-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GENERATE_MODEL: "claude-sonnet-4-6"
          LENGTH_MODE: "graphemes"
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python src/generate.py

      - name: Commit new drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/queue.json fallback/evergreen.json
          if git diff --cached --quiet; then
            echo "変更なし（コミット不要）"
          else
            git commit -m "chore: add generated drafts [skip ci]"
            git push
          fi
